name: Build Windows EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller pygame sounddevice numpy
      - run: pyinstaller --onefile --windowed --name theremin2 --hidden-import=pygame --hidden-import=sounddevice --hidden-import=numpy theremin.py
      - uses: actions/upload-artifact@v4
        with:
          name: theremin2.exe
          path: dist/theremin2.exe
