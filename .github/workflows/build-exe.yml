name: Build Windows EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller pygame sounddevice numpy
      - run: pyinstaller --onefile --windowed --name noteStudy33 --hidden-import=pygame --hidden-import=sounddevice --hidden-import=numpy theremin.py
      - uses: actions/upload-artifact@v4
        with:
          name: theremin2.exe
          path: dist/theremin2.exe
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Theremin v1.0 Build ${{ github.run_number }}
          files: dist/theremin2.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
