name: Build Windows EXE
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller pygame sounddevice numpy
      - name: Find latest python
        id: find
        shell: bash
        run: |
          LATEST=$(ls -v python/noteStudy*.py | tail -n 1)
          BASENAME=$(basename $LATEST .py)
          echo "latest_file=$LATEST" >> $GITHUB_OUTPUT
          echo "base_name=$BASENAME" >> $GITHUB_OUTPUT
          echo "Building $LATEST as $BASENAME.exe"
      - run: pyinstaller --onefile --windowed --name ${{ steps.find.outputs.base_name }} ${{ steps.find.outputs.latest_file }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find.outputs.base_name }}.exe
          path: dist/${{ steps.find.outputs.base_name }}.exe
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: ${{ steps.find.outputs.base_name }} Build ${{ github.run_number }}
          files: dist/${{ steps.find.outputs.base_name }}.exe
