name: Build Windows EXE
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller pygame sounddevice numpy
      - run: pyinstaller --onefile --windowed --name noteStudy39 python/noteStudy39.py
      - uses: actions/upload-artifact@v4
        with:
          name: noteStudy39.exe
          path: dist/noteStudy39.exe
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: noteStudy39 Build ${{ github.run_number }}
          files: dist/noteStudy39.exe
